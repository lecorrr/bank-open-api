apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
spec:
  replicas: 1
  # One Keycloak at a time: two would share one database and import the realm in a race.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "keycloak.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "keycloak.labels" . | nindent 8 }}
      annotations:
        # A changed realm file restarts Keycloak; it imports the realm only if the realm is missing, which
        # scripts/cluster-up.sh sees to by emptying Keycloak's database first. cluster-up compares this value.
        checksum/realm: {{ .Files.Get "realm/bank-realm.json" | sha256sum }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # The "restricted" Pod Security Standard: the official image runs as user 1000.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          # The image is built for H2 and without our options, so Keycloak builds itself for them at each start:
          # about half a minute.
          args: ["start", "--import-realm"]
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: {{ .Values.database.url | quote }}
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: username
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: password
            # The first admin, in the master realm; Keycloak creates it only while the database is empty.
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adminSecret }}
                  key: username
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adminSecret }}
                  key: password
            - name: KC_HOSTNAME
              value: {{ .Values.hostname | quote }}
            - name: KC_HOSTNAME_ADMIN
              value: {{ .Values.adminHostname | quote }}
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            # Traefik ends the TLS and sends plain HTTP with X-Forwarded-* headers; its entry point drops such
            # headers when a client sends them.
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            # The client certificate Traefik passes on in X-Forwarded-Tls-Client-Cert: tokens are bound to it.
            - name: KC_SPI_X509CERT_LOOKUP__PROVIDER
              value: traefik
            - name: KC_HEALTH_ENABLED
              value: "true"
            # ECS JSON on the console, as the services write theirs: the logging stack reads it field by field and
            # masks the usernames in Keycloak's events (cluster/charts/logging).
            - name: KC_LOG_CONSOLE_OUTPUT
              value: json
            - name: KC_LOG_CONSOLE_JSON_FORMAT
              value: ecs
            # The realm file names it as ${SMOKE_TEST_CERTIFICATE}: the key that signs the provider's JWTs.
            - name: SMOKE_TEST_CERTIFICATE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.smokeTestProviderSecret }}
                  key: certificate-base64
            # ${APPROVAL_CLIENT_SECRET}: the secret of bank-open-api's client for the customer pages.
            - name: APPROVAL_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.approvalClientSecret }}
                  key: client-secret
            # ${TEST_CUSTOMER_PASSWORD}: the test customer the smoke test signs in as.
            - name: TEST_CUSTOMER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.testCustomerSecret }}
                  key: password
            # Half of the memory limit for the heap; the rest is metaspace, threads and the build at start.
            - name: JAVA_OPTS_KC_HEAP
              value: "-XX:MaxRAMPercentage=50 -XX:InitialRAMPercentage=25"
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          # The build at start and the first database migration take a while: up to five minutes.
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            # Keycloak writes its build into the image's folders at start (see args), so the root file system
            # stays writable; "restricted" does not ask for it to be read-only.
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm
          configMap:
            name: {{ .Release.Name }}-realm
