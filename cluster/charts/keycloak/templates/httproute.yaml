{{- if .Values.route.enabled }}
# Providers and customers reach Keycloak only through the bank's Gateway, over HTTPS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.route.gateway }}
      sectionName: {{ .Values.route.listener }}
  rules:
    # What only providers call: the token endpoint (introspection is under it too) and pushed authorization
    # requests. The longer paths win over the rule below.
    - matches:
        - path:
            type: PathPrefix
            value: /realms/bank/protocol/openid-connect/token
        - path:
            type: PathPrefix
            value: /realms/bank/protocol/openid-connect/ext/par/request
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: {{ .Values.route.providerMiddleware }}
      backendRefs:
        - name: {{ .Release.Name }}
          port: 8080
    # The rest of the realm, for customers' browsers and providers alike.
    - matches:
        - path:
            type: PathPrefix
            value: /realms/bank
        - path:
            type: PathPrefix
            value: /resources
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: {{ .Values.route.clientCertificateMiddleware }}
      backendRefs:
        - name: {{ .Release.Name }}
          port: 8080
{{- end }}
