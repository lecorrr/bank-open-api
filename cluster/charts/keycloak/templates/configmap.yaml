# The realm "bank", imported when Keycloak starts and finds no realm of that name. A changed file reaches an existing
# cluster through scripts/cluster-up.sh, which then empties Keycloak's database so the realm is imported afresh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-realm
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
data:
  bank-realm.json: |-
{{ .Files.Get "realm/bank-realm.json" | indent 4 }}
