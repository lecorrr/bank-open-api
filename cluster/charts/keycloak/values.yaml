image:
  repository: quay.io/keycloak/keycloak
  tag: 26.8.2

# Keycloak's public address: Traefik's HTTPS entry point as k3d publishes it. Tokens name it as their issuer, and
# a provider's signed JWT names it as its audience. Back-channel calls (the token endpoint, the keys) may come
# through other addresses, such as https://k3d-bank-serverlb from Jenkins.
hostname: https://localhost:8443
# The admin console stays off the edge: kubectl -n bank port-forward svc/keycloak 8082:8080 (docs/cluster.md).
# Not 8081: Jenkins has that port.
adminHostname: http://localhost:8082

database:
  url: jdbc:postgresql://postgres:5432/keycloak
  # Secret with the keys username and password; scripts/cluster-up.sh creates it.
  existingSecret: keycloak-db

# Secret with the keys username and password of the first admin; scripts/cluster-up.sh creates it.
adminSecret: keycloak-admin

# Secret with the smoke-test provider's certificate under "certificate-base64" (base64 DER on one line, as the
# realm file needs it); scripts/cluster-up.sh creates it.
smokeTestProviderSecret: smoke-test-provider

# Secret with the provider app's certificate under "certificate-base64", as for the smoke test, and nothing else: the
# key stays in the provider's own namespace. scripts/cluster-up.sh creates it.
providerAppSecret: provider-app-certificate

# Secret with the key client-secret of bank-open-api's client bank-approval; scripts/cluster-up.sh creates it.
approvalClientSecret: bank-approval-client

# Secret with the keys username and password of the test customer (customer number C1001 in bank-core's demo
# data); scripts/cluster-up.sh creates it.
testCustomerSecret: test-customer

# The routes from the bank's Gateway: the realm's endpoints and the login pages' resources (step 4). The master
# realm and the admin console are not routed.
route:
  enabled: true
  gateway: bank-gateway
  listener: websecure
  # Traefik's middleware that passes the provider's client certificate on (cluster/platform/edge.yaml): Keycloak
  # binds the tokens it issues to it.
  clientCertificateMiddleware: pass-client-cert
  # The same, then the provider's rate limit: for the endpoints only providers call (token, pushed authorization
  # requests).
  providerMiddleware: provider-api

# Keycloak's spans go to the trace collector (cluster/charts/logging) over OTLP/gRPC, Keycloak's default protocol.
tracing:
  endpoint: http://trace-collector.logging.svc.cluster.local:4317

resources:
  requests:
    cpu: 200m
    memory: 768Mi
  limits:
    memory: 1Gi
