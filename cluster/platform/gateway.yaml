# The bank's entry point. Traefik serves it: a listener's port must be one of Traefik's entry points, and 8443 is
# "websecure", which k3d publishes on localhost:8443. Its certificate comes from the bank's test CA
# (scripts/cluster-up.sh); edge.yaml sets the TLS options. Routes may attach from the bank namespace, from logging
# for Kibana (cluster/charts/logging) and from provider for the provider app (provider-app/chart).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: bank-gateway
  namespace: bank
spec:
  gatewayClassName: traefik
  listeners:
    - name: websecure
      protocol: HTTPS
      port: 8443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: bank-gateway-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - bank
                  - logging
                  - provider
