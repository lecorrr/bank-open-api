# Settings for the Traefik that k3s ships: routes come from Gateway API objects. The Gateway itself belongs to the
# bank namespace (platform/gateway.yaml), so Traefik's own default Gateway stays off.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    providers:
      kubernetesGateway:
        enabled: true
    gateway:
      enabled: false
    # A header whose name only looks like another (X_Forwarded_Tls_Client_Cert, X.Forwarded...) is dropped, so
    # a client cannot slip a certificate header past the entry point to a service that reads names loosely.
    additionalArguments:
      - --entryPoints.web.http.aliasHeadersStrategy=delete
      - --entryPoints.websecure.http.aliasHeadersStrategy=delete
    # Every request's span goes to the trace collector (cluster/charts/logging), the start of each trace through the
    # bank. Traefik masks the values of query parameters in its spans (REDACTED) and records no headers; the
    # collector drops the query and the caller's address on top of that. A traceparent a caller sends continues its
    # trace, as W3C Trace Context has it.
    tracing:
      otlp:
        enabled: true
        http:
          enabled: true
          endpoint: http://trace-collector.logging.svc.cluster.local:4318/v1/traces
