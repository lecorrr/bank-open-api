# Values for the k3d cluster in cluster/. Jenkins sets image.tag to the commit it built.
image:
  repository: localhost:5050/bank-open-api
  tag: ""   # empty: the chart's appVersion
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  port: 8090

bankCore:
  url: http://bank-core:8080

# The bank's address, where customers' browsers open its pages: scaRedirect links and the sign-in's redirect URI
# start with it.
publicUrl: https://localhost:8443
# The API's own host, where Traefik asks for the provider's client certificate in the TLS handshake. RFC 9728's
# resource starts with it, and the API's route (templates/ingressroute.yaml) takes its host name from it.
apiUrl: https://api.localhost:8443

database:
  url: jdbc:postgresql://postgres:5432/openbanking
  # Secret with the keys username and password; scripts/cluster-up.sh creates it.
  existingSecret: bank-open-api-db

# Providers' tokens come from Keycloak's realm bank. The issuer is Keycloak's public address, as every token names
# it; the signing keys are read from Keycloak inside the cluster.
providerTokens:
  issuer: https://localhost:8443/realms/bank
  jwkSetUri: http://keycloak:8080/realms/bank/protocol/openid-connect/certs

# Customers sign in on the bank's pages through Keycloak's client bank-approval, in the same realm. The browser goes
# to the issuer's public address; bank-open-api redeems the code inside the cluster.
customerSignIn:
  tokenUri: http://keycloak:8080/realms/bank/protocol/openid-connect/token
  # Secret with the key client-secret; scripts/cluster-up.sh creates it, and Keycloak's chart reads the same one.
  existingSecret: bank-approval-client

# The routes into this service, over HTTPS only (Traefik's TLS and middleware: cluster/platform/edge.yaml).
route:
  enabled: true
  # The customer pages and the sign-in's two steps, through the bank's Gateway (made by scripts/cluster-up.sh) on
  # the bank's address, where browsers come without a client certificate.
  gateway: bank-gateway
  listener: websecure
  pagePathPrefixes:
    - /customer
    - /oauth2/authorization
    - /login/oauth2/code
  # The API and RFC 9728's metadata, on the host of apiUrl: a Traefik IngressRoute, because in Traefik 3.7 every
  # Gateway listener takes the TLS options named default, and only an IngressRoute can name its own.
  api:
    entryPoint: websecure
    # The gateway's certificate, which also carries the API's host name.
    tlsSecret: bank-gateway-tls
    # A client certificate from the bank's CA is required in the handshake.
    tlsOptions: providers
    # The provider's certificate passed on to this service, then the provider's rate limit.
    middleware: provider-api

# The JVM takes 60 % of the limit for its heap (see the Dockerfile); the rest is metaspace and threads.
resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 512Mi
