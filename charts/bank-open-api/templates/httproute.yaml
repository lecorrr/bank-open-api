{{- if .Values.route.enabled }}
# Providers reach the API only through the bank's Gateway; Traefik routes /v2 here.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "bank-open-api.name" . }}
  labels:
    {{- include "bank-open-api.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.route.gateway }}
      sectionName: {{ .Values.route.listener }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.route.pathPrefix }}
      backendRefs:
        - name: {{ include "bank-open-api.name" . }}
          port: {{ .Values.service.port }}
{{- end }}
