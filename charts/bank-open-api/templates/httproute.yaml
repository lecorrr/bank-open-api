{{- if .Values.route.enabled }}
# Customers' browsers reach the bank's pages and the sign-in through the bank's Gateway, on the bank's address.
# The API is not here: it has a host of its own (ingressroute.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "bank-open-api.name" . }}
  labels:
    {{- include "bank-open-api.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.route.gateway }}
      sectionName: {{ .Values.route.listener }}
  rules:
    - matches:
        {{- range .Values.route.pagePathPrefixes }}
        - path:
            type: PathPrefix
            value: {{ . }}
        {{- end }}
      backendRefs:
        - name: {{ include "bank-open-api.name" . }}
          port: {{ .Values.service.port }}
{{- end }}
