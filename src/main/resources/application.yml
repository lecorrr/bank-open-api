server:
  port: 8090   # bank-core has 8080 when both run on one machine
  # Behind Traefik the customer's browser talks HTTPS to localhost:8443; X-Forwarded-* tell Tomcat so, and the
  # redirects Spring Security builds for the customer pages point there instead of at the pod.
  forward-headers-strategy: native
  servlet:
    session:
      # Only the customer pages keep a session: a sign-in and a decision take a few minutes.
      timeout: 10m
      cookie:
        secure: true
        same-site: lax

spring:
  application:
    name: bank-open-api
  datasource:
    # In the cluster the Helm chart sets all three; on this machine compose.yaml runs the database.
    url: ${DB_URL:jdbc:postgresql://localhost:${OPENBANKING_DB_PORT:5437}/openbanking}
    username: ${DB_USER:openbanking}
    password: ${DB_PASSWORD:openbanking}
  jackson:
    # Leave out what is not set, as the contract's optional fields expect.
    default-property-inclusion: non_null
  http:
    clients:
      # A slow bank-core must not hold a provider's request for long; the provider gets 503 and retries.
      connect-timeout: 2s
      read-timeout: 5s

bank-open-api:
  # The bank's address, where customers' browsers open its pages: scaRedirect links and the sign-in's redirect URI
  # start with it.
  public-url: ${PUBLIC_URL:https://localhost:8443}
  # The API's own host, where Traefik asks for the provider's client certificate in the TLS handshake: RFC 9728's
  # resource and the metadata link in a refusal's challenge start with it.
  api-url: ${API_URL:https://api.localhost:8443}
  bank-core:
    url: ${BANK_CORE_URL:http://localhost:8080}
  consents:
    # The longest a consent may run; a later validTo, such as the contract's 9999-12-31, is cut back to it.
    max-validity-days: 180
  payments:
    # When bank-core could not be asked to make an approved payment's transfer, the retry job tries again this long
    # after the last attempt. At least 30s: longer than a call to bank-core (see spring.http.clients).
    retry-delay: 30s
  provider-tokens:
    # Keycloak's realm bank. The issuer is its public address, which every token names; the Helm chart points
    # jwk-set-uri at Keycloak inside the cluster. The defaults are the k3d cluster's public addresses.
    issuer: ${PROVIDER_TOKENS_ISSUER:https://localhost:8443/realms/bank}
    jwk-set-uri: ${PROVIDER_TOKENS_JWK_SET_URI:https://localhost:8443/realms/bank/protocol/openid-connect/certs}
    # Keycloak's client scope "accounts" puts this into the tokens it issues for this API.
    audience: bank-open-api
  customer-sign-in:
    # Keycloak's client for the customer pages, in the same realm as the providers' tokens. The customer's browser
    # goes to the public address; the Helm chart points the token endpoint at Keycloak inside the cluster and sets
    # the secret.
    client-id: bank-approval
    client-secret: ${CUSTOMER_SIGN_IN_CLIENT_SECRET:not-set-outside-the-cluster}
    issuer: ${bank-open-api.provider-tokens.issuer}
    authorization-uri: ${bank-open-api.provider-tokens.issuer}/protocol/openid-connect/auth
    token-uri: ${CUSTOMER_SIGN_IN_TOKEN_URI:${bank-open-api.provider-tokens.issuer}/protocol/openid-connect/token}
    jwk-set-uri: ${bank-open-api.provider-tokens.jwk-set-uri}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true   # /actuator/health/liveness and /readiness for Kubernetes, also when run outside it
  tracing:
    sampling:
      # Keep every trace. Nothing is exported yet; logs carry the trace ids either way.
      probability: 1.0

logging:
  level:
    dev.tkachuk.openbanking: INFO
  pattern:
    # trace and span id from tracing, the provider's X-Request-ID from RequestIdFilter, on every plain-text line
    correlation: "[%X{traceId:-},%X{spanId:-}] [%X{requestId:-}] "
  structured:
    # For ECS JSON logs (LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs, set in the Helm chart): MDC keys to their ECS
    # field names. The brackets keep the camel case of the keys.
    json:
      rename:
        "[traceId]": trace.id
        "[spanId]": span.id
        "[requestId]": http.request.id
