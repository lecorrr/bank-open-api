        intermediaryAgent2:
          $ref: '#/components/schemas/agentDescription1'
        creditorAccount:
          $ref: '#/components/schemas/accountReference1'
        creditorAgent:
          $ref: '#/components/schemas/agentDescription1'
        creditor:
          $ref: '#/components/schemas/partyDescription1'
        ultimateCreditor:
          description: |
            Not offered by the bank: a payment initiation naming an ultimate creditor is refused with
            PARAMETER_NOT_SUPPORTED.
          type: object
        remittanceInformationUnstructured:
          $ref: '#/components/schemas/remittanceInformationUnstructured'
