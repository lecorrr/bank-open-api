  headers:
    ASPSP-Multiple-Consent-Support:
      description: |
        true if the ASPSP supports the Multiple Consent Service.
        false if the ASPSP does not support the Multiple Consent Service.
        If not provided, this also implies that the ASPSP does not support the Multiple Consent Service.
      schema:
        type: boolean
      required: false
    ASPSP-SCA-Approach:
      description: |
        This data element must be contained, if the SCA Approach is already fixed.
        Possible values are
          * EMBEDDED
          * DECOUPLED
          * REDIRECT
        The OAuth SCA approach will be subsumed by REDIRECT.
      schema:
        type: string
        enum:
        - EMBEDDED
        - DECOUPLED
        - REDIRECT
        example: EMBEDDED
      required: false
    Location:
      description: |
        Location of the created resource.
      schema:
        type: string
        format: url
      required: true
    X-Request-ID:
      description: ID of the request, unique to the call, as determined by the initiating party.
      required: true
      example: 99391c7e-ad88-49ec-a2ad-99ddcb1f7721
      schema:
        type: string
        format: uuid
  requestBodies:
    accountAccessConsent:
      description: |
        Request body for an Account Access consent establishing request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/accountAccessConsent'
    paymentInitiation:
      description: |
        JSON request body for a single payment of the product in the path.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/paymentInitiation_json'
  securitySchemes:
    BearerAuthOAuth:
      description: |
        An access token from the bank's Keycloak (realm bank), bound to the provider's client certificate
        (RFC 8705). The provider signs in with a JWT signed by the key of that certificate (private_key_jwt,
        PS256), over mutual TLS, and sends every request over mutual TLS with the same certificate.
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://localhost:8443/realms/bank/protocol/openid-connect/token
          scopes:
            accounts: Consents and account information
            payments: Payment initiation
