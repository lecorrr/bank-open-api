        The ASPSP shall give at least one of the account reference identifiers:
          - iban
          - bban
          - msisdn
          - ownerName
          - ownerNames
          - name
          - displayName
          - bic
        If the account is a multicurrency account currency code in "currency" is set to "XXX".
      type: object
      required:
      - resourceId
      - currency
      properties:
        resourceId:
          description: This is the data element to be used in the path when retrieving data from a dedicated account.
            This shall be filled, if an addressable resource is created by the ASPSP on the /accounts endpoint..
          type: string
        iban:
          $ref: '#/components/schemas/iban'
        bban:
          $ref: '#/components/schemas/bban'
        msisdn:
          $ref: '#/components/schemas/msisdn'
        currency:
          $ref: '#/components/schemas/currencyCode'
        ownerName:
          $ref: '#/components/schemas/ownerName'
        ownerNames:
          description: |
            List of owner names.
          type: array
          items:
            $ref: '#/components/schemas/accountOwner'
        name:
          $ref: '#/components/schemas/name'
        displayName:
          $ref: '#/components/schemas/displayName'
        product:
          description: Product name of the bank for this account, proprietary definition.
          type: string
          maxLength: 35
        cashAccountType:
