apiVersion: v1
kind: Service
metadata:
  name: {{ include "provider-app.name" . }}
  labels:
    {{- include "provider-app.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "provider-app.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
